[GoM]
GoMSize=6
;   Long list needed since GoM halts everything if none on list are available to cast
GoMSpell1=Composite Fire
GoMSpell2=Ethereal Twist
GoMSpell3=Ethereal Ignition
GoMSpell4=Ethereal Mortar
GoMSpell5=Lunar Ice Comet
GoMSpell6=Flashbroil

[KConditions]
ConOn=1
CondSize=9
Cond1=${Target.Named}
Cond2=${Target.Named} && ${Me.AltAbilityReady[Improved Twincast]} && !${Me.Buff[Improved Twincast].ID} && ${Range.Between[60,98:${Target.PctHPs}]}
Cond3=${Target.PctHPs} > 70 && !${Target.Buff[Thaumaturgic Vortex Effect].ID}
Cond4=!${Me.Buff[Twincast].ID}
Cond5=${Me.Buff[Syllable of Fire].ID} || ${Me.Buff[Gift of Fire].ID} || ${Me.Buff[Twincast].ID} || ${Me.Buff[Improved Twincast].ID}
Cond6=${Me.Buff[Syllable of Ice].ID} || ${Me.Buff[Gift of Ice].ID} || ${Me.Buff[Twincast].ID} || ${Me.Buff[Improved Twincast].ID}
Cond7=${Me.Buff[Syllable of Magic].ID} || ${Me.Buff[Gift of Arcana].ID} || ${Me.Buff[Twincast].ID} || ${Me.Buff[Improved Twincast].ID}
Cond8=!${Me.Buff[Twincast].ID} && !${Me.Buff[Improved Twincast].ID} && ${Target.PctHPs} > 70
Cond9=${Me.SpellReady[${InvSlot[Chest].Item.Name}]}
Cond10=${Me.Buff[Syllable of Fire].ID} && ${Me.Buff[Twincast].ID} && ${Target.Buff[Thaumaturgic Vortex Effect].ID}
[Spells]
