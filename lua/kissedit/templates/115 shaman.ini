[KConditions]
; If a Condition below is "NULL" it's because I personally use something there that won't apply to anyone else, feel free to remove the lines and decrease CondSize accordingly
ConOn=1
CondSize=16
Cond1=${Me.CurrentHPs} > 100000 && ${Math.Calc[${Me.MaxMana}-${Me.CurrentMana}].Int} > 44000
Cond2=${Target.ID} && ${Target.BuffsPopulated} && !${Target.Slowed.ID}
Cond3=NULL
Cond4=!${Me.Buff[Talisman of the Sabretooth].ID} && !${Me.Buff[Dissident Roar].ID} && ${Me.GemTimer[Dissident Roar]}
Cond5=${Spell[Savage Growth].StacksTarget}
Cond6=${Target.Named}
Cond7=NULL
Cond8=NULL
Cond9=!${Me.Song[Cloud of Renewal].ID}
Cond10=!${Me.Song[Eyrzekla's Watch].ID}
Cond11=${Me.CombatState.Equal[COMBAT]}
Cond12=${Me.PctMana} > 70 && ${Target.PctHPs} > 80
Cond13=NULL
Cond14=${Me.Song[Healing Twincast].ID}
Cond15=${Me.PctMana} < 60 && ${Me.PctHPs} > 95
Cond16=${SpawnCount[${Me.Name}]}>1

