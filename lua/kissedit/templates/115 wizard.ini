[KConditions]
ConOn=1
CondSize=15
Cond1=${Target.Named} && ${Target.PctHPs} > 10
Cond2=${Target.ID} && !${Target.Buff[Lower Element].ID}
Cond3=${Target.ID} && ${Target.Named} && ${Me.PctMana} > 60 && ${Range.Between[20,96:${Target.PctHPs}]} && ${Target.BuffsPopulated} && !${Target.Buff[Mana Burn].ID}
cond4=${Target.Named} && !${Me.Song[Arcane Destruction].ID}
cond5=${Target.Named} && !${Me.Song[Frenzied Devastation].ID}
cond6=${Target.Named} && ${Target.PctHPs} > 1 && (${Target.Named} && ${Me.Song[Arcane Destruction].ID} || ${Target.Named} && ${Me.Song[Frenzied Devastation].ID})
cond7=${Target.ID} && ${Target.PctHPs} > 10
cond8=${Target.Named} && !${Me.Buff[Twincast Rk. II].ID} && !${Me.Buff[Improved Twincast].ID} && !${Me.Buff[Twincast].ID}
cond9=${Target.Named} && ${Me.Song[Frenzied Devastation].ID} || ${Target.Named} && ${Me.Song[Arcane Destruction].ID}
cond10=${Target.ID} && ${Range.Between[30,99:${Target.PctHPs}]} && ${Me.PctMana} < 95
cond11=!${Me.Buff[Twincast Rk. II].ID} && !${Me.Buff[Twincast].ID} && !${Me.Buff[Improved Twincast].ID} && !${Me.Buff[Syllable of Fire].ID} && !${Me.Buff[Syllable of Ice].ID} && !${Me.Buff[Syllable of Magic].ID && !${Me.Buff[Flashbrand Singe].ID}
cond12=${Me.Buff[Syllable of Fire].ID} || ${Me.Buff[Twincast Rk. II].ID} || ${Me.Buff[Twincast].ID} || ${Me.Buff[Improved Twincast].ID} || ${Me.Buff[Flashbrand Singe].ID}
cond13=${Me.Buff[Syllable of Ice].ID} || ${Me.Buff[Twincast Rk. II].ID} || ${Me.Buff[Twincast].ID} || ${Me.Buff[Improved Twincast].ID} || ${Me.Buff[Flashbrand Singe].ID}
cond14=${Me.Buff[Syllable of Magic].ID} || ${Me.Buff[Twincast Rk. II].ID} || ${Me.Buff[Twincast].ID} || ${Me.Buff[Improved Twincast].ID} || ${Me.Buff[Flashbrand Singe].ID}
