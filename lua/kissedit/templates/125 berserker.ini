Cond13=!${Target.Buff[Conqueror's Coalition Trigger].ID}
Cond14=!${Me.Song[Prophet's Gift of the Ruchu].ID}
Cond15=${Me.PctHPs} < 35 && ${Me.Combat}
Cond16=${Me.PctHPs} < 50 && ${Me.Combat}
Cond17=${Me.PctEndurance} <= 5
Cond18=${Me.ActiveDisc.Name.Equal[${Spell[Mangling Discipline].RankName}]} && ${Me.Song[Convalesce].ID} && ${Me.PctEndurance} >= 20
Cond19=${Target.ID} != ${Me.RaidAssistTarget[1].ID}
Cond20=!${Me.Song[Ancient: Cry of Chaos].ID} && !${Me.Song[Ruaabri's Fury].ID} && !${Me.Song[Ecliptic Fury].ID}
Cond21=${Target.Name.Equal[Tantor]} && ${Target.PctHP} < 93 || ${Target.Name.Equal[Klandicar]} && ${Target.PctHP} < 31
Cond22=!${Me.Song[Ruaabri's Fury].ID} && !${Me.Song[Ecliptic Fury].ID}
Cond23=${Me.PctHPs} < 90
