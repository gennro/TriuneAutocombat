name: Draft & Publish Release

on:
  push:
    tags:
      - 'v*' # Triggers on push of tags like v1.0.0, v1.0.1
  workflow_dispatch: # Allows manual trigger from the Actions UI tab

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage and Package Files
        run: |
          # Create staging directory
          mkdir -p staging

          # Copy directories maintaining full structure
          if [ -d "config" ]; then cp -r config staging/config; fi
          if [ -d "lua" ]; then cp -r lua staging/lua; fi

          # Copy root files into staging root
          cp -f *.lua staging/ 2>/dev/null || true
          cp -f README* staging/ 2>/dev/null || true
          cp -f CHANGELOG* staging/ 2>/dev/null || true

          # Archive contents of staging folder while retaining folder hierarchy
          cd staging
          zip -r ../TriuneAutocombat.zip .
          cd ..

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: TriuneAutocombat.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
