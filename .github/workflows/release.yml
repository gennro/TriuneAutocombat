name: Draft & Publish Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g., v1.6)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Release Notes & Instructions
        run: |
          python3 - << 'EOF'
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Extract latest release entry from top up to first '---' section separator
          sections = content.split('\n---\n')
          latest_entry = sections[0].strip()

          # Strip '# Triune AutoCombat Change Log' title line if present
          lines = latest_entry.split('\n')
          if lines and lines[0].startswith('# '):
              lines = lines[1:]
          latest_notes = '\n'.join(lines).strip()

          instructions = '''---

          ## 📦 Installation & Updating Instructions

          ### 🆕 New Installation
          1. Go here and grab the latest macroquest release https://github.com/macroquest/macroquest/releases and extract under your user folder.
          2. Download TriuneAutocombat-full.zip below and extract contents to the same folder you extract macroquest to.
          3. Start **`MacroQuest.exe`** before launching EverQuest.

          ### 🔄 Updating an Existing Install
          - **Option 1 (Recommended — Easiest)**: **In-Game Updater**
            - Click the **[Updater]** button on the top window header or type `/ac update` in chat.
            - Click **Check for Updates**, then **Update Now** to update and reload all scripts automatically without leaving the game.
            - Alternatively, run **`update.bat`** (Windows) or **`update.sh`** (Linux) from your `mq2triune/` folder.
          - **Option 2 (Manual Update)**:
            - Download **`TriuneAutocombat-Update.zip`** from the Assets below.
            - Extract and overwrite the files into your existing MacroQuest directory.
            - *Note: Your personal settings and saved loadouts in `triune_loadout.lua` are preserved and will never be overwritten.*
          '''

          # Strip leading indentation from instructions block
          cleaned_lines = []
          for line in instructions.split('\n'):
              if line.startswith('          '):
                  cleaned_lines.append(line[10:])
              else:
                  cleaned_lines.append(line)
          instructions_clean = '\n'.join(cleaned_lines)

          full_body = latest_notes + '\n\n' + instructions_clean.strip() + '\n'

          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(full_body)

          print("Generated RELEASE_NOTES.md successfully")
          EOF

      - name: Package Release Archives
        run: |
          git archive --format=zip -o TriuneAutocombat-Update.zip HEAD TAC/lua TAC/config TAC/triune_updater.py TAC/update.bat TAC/update.sh README.md CHANGELOG.md
          git archive --format=zip -o TriuneAutocombat-full.zip HEAD TAC/lua TAC/config TAC/triune_updater.py TAC/update.bat TAC/update.sh TAC/resources README.md CHANGELOG.md
      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TriuneAutocombat-Update.zip
            TriuneAutocombat-full.zip
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
