name: Draft & Publish Release

on:
  push:
    tags:
      - 'v*'
      - 'V*' # Added uppercase V just in case!
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g., v1.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package Release Archive
        run: |
          git archive --format=zip -o TriuneAutocombat.zip HEAD

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: TriuneAutocombat.zip
          tag_name: ${{ inputs.tag_name || github.ref_name }} # Uses manual input if provided, otherwise defaults to pushed tag
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

