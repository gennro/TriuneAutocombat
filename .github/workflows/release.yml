name: Draft & Publish Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g., v1.6)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # On manual runs package the requested tag, not whatever branch was selected.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Generate Release Notes & Instructions
        run: |
          python3 - << 'EOF'
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Extract latest release entry from top up to first '---' section separator
          sections = content.split('\n---\n')
          latest_entry = sections[0].strip()

          # Strip '# Triune AutoCombat Change Log' title line if present
          lines = latest_entry.split('\n')
          if lines and lines[0].startswith('# '):
              lines = lines[1:]
          latest_notes = '\n'.join(lines).strip()

          instructions = '''---

          ## 📦 Installation & Updating Instructions

          ### 🆕 New Installation
          1. Go here and grab the latest macroquest release https://github.com/macroquest/macroquest/releases and extract under your user folder.
          2. Download **`TriuneAutocombat-full.zip`** below and extract directly into the root of your MacroQuest folder. It contains everything: the Lua scripts, config, the offline game database (`resources/gamedb/`) and the MQ2Nav navmeshes (`resources/MQ2Nav/`).
          3. If running windows add an exception to your MQ folder before running.
          4. Start **`MacroQuest.exe`** before launching EverQuest.

          ### 🔄 Updating an Existing Installation
          1. Download **`TriuneAutocombat-Update.zip`** from the Assets below. It contains the Lua scripts, config and the offline game database (`resources/gamedb/`), but not the MQ2Nav navmeshes - grab the full zip if you also need those.
          2. Extract directly into the root of your MacroQuest folder (overwrite files if prompted).
          *Note: Your personal settings and saved loadouts in `triune_loadout.lua` are preserved and will never be overwritten.*
          '''

          # Strip leading indentation from instructions block
          cleaned_lines = []
          for line in instructions.split('\n'):
              if line.startswith('          '):
                  cleaned_lines.append(line[10:])
              else:
                  cleaned_lines.append(line)
          instructions_clean = '\n'.join(cleaned_lines)

          full_body = latest_notes + '\n\n' + instructions_clean.strip() + '\n'

          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(full_body)

          print("Generated RELEASE_NOTES.md successfully")
          EOF

      - name: Package Release Archives
        run: |
          # Both archives are built from the TAC/ tree so new modules, config
          # and resource files are picked up automatically. The update zip
          # ships everything except the MQ2Nav navmeshes (~1 GB, rarely
          # change); the full zip ships the whole tree.
          git archive --format=zip --add-file=README.md --add-file=CHANGELOG.md \
            -o TriuneAutocombat-Update.zip HEAD:TAC . ':!resources/MQ2Nav'
          git archive --format=zip --add-file=README.md --add-file=CHANGELOG.md \
            -o TriuneAutocombat-full.zip HEAD:TAC .

      - name: Verify Archive Contents
        run: |
          set -e
          for z in TriuneAutocombat-Update.zip TriuneAutocombat-full.zip; do
            echo "== $z ($(du -h "$z" | cut -f1))"
            unzip -l "$z" | grep -v '/MQ2Nav/'
            unzip -l "$z" | grep -q 'lua/triune.lua'   || { echo "missing lua/triune.lua in $z"; exit 1; }
            unzip -l "$z" | grep -q 'gamedb/manifest.txt' || { echo "missing resources/gamedb in $z"; exit 1; }
          done
          unzip -l TriuneAutocombat-Update.zip | grep -q '\.navmesh' && { echo "update zip must not contain navmeshes"; exit 1; }
          unzip -l TriuneAutocombat-full.zip   | grep -q '\.navmesh' || { echo "full zip is missing navmeshes"; exit 1; }
          echo "Archives verified"
      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TriuneAutocombat-Update.zip
            TriuneAutocombat-full.zip
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
