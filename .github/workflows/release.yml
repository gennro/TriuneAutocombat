name: Draft & Publish Release

on:
  push:
    tags:
      - 'v*'
      - 'V*' # Added uppercase V just in case!
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g., v1.1)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage and Package Files
        run: |
          mkdir -p staging
          if [ -d "config" ]; then cp -r config staging/config; fi
          if [ -d "lua" ]; then cp -r lua staging/lua; fi
          cp -f *.lua staging/ 2>/dev/null || true
          cp -f README* staging/ 2>/dev/null || true
          cp -f CHANGELOG* staging/ 2>/dev/null || true

          cd staging
          zip -r ../TriuneAutocombat.zip .
          cd ..

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: TriuneAutocombat.zip
          tag_name: ${{ inputs.tag_name || github.ref_name }} # Uses manual input if provided, otherwise defaults to pushed tag
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
