name: Draft & Publish Release

on:
  push:
    tags:
      - 'v*' # Triggers on push of tags like v1.0.0, v1.0.1

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stage and Package Files
        run: |
          # Create staging folder
          mkdir -p staging

          # Copy folders if they exist
          if [ -d "config" ]; then cp -r config staging/; fi
          if [ -d "lua" ]; then cp -r lua staging/; fi

          # Copy matching files if they exist (ignoring errors if absent)
          cp -f *.lua staging/ 2>/dev/null || true
          cp -f README* staging/ 2>/dev/null || true
          cp -f CHANGELOG* staging/ 2>/dev/null || true

          # Create zip file from staging contents
          zip -r TriuneAutocombat.zip -j staging/* 2>/dev/null || (cd staging && zip -r ../TriuneAutocombat.zip .)

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: TriuneAutocombat.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
