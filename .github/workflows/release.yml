name: Draft & Publish Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to release (e.g., v1.6)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # On manual runs package the requested tag, not whatever branch was selected.
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Generate Release Notes
        env:
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          python3 - << 'EOF'
          import os, re, sys

          tag = os.environ.get('TAG_NAME', '')
          version = re.sub(r'^[vV]', '', tag).strip()

          # RELEASES.md holds a short, hand-written summary per release
          # (## <version> headings). CHANGELOG.md keeps the detailed history
          # and is linked from the release body instead of pasted into it.
          with open('RELEASES.md', 'r', encoding='utf-8') as f:
              content = f.read()

          entries = re.split(r'(?m)^## ', content)[1:]   # drop the file preamble
          if not entries:
              sys.exit('RELEASES.md has no "## <version>" entries')

          notes = None
          for entry in entries:
              heading, _, body = entry.partition('\n')
              if heading.strip() == version:
                  notes = body
                  break
          if notes is None:
              heading, _, notes = entries[0].partition('\n')
              print(f'::warning::No "## {version}" entry in RELEASES.md, using the top entry ({heading.strip()})')

          # Drop the trailing entry separator if the author left one in.
          notes = re.sub(r'\n---\s*$', '', notes.strip()) + '\n'

          footer = """
          ---

          **Full change log:** [CHANGELOG.md](https://github.com/{repo}/blob/{tag}/CHANGELOG.md)

          ## 📦 Installation & Updating

          ### 🆕 New installation
          1. Download the latest **RoF2** MacroQuest from https://github.com/macroquest/macroquest/releases and extract it somewhere like `C:\\MacroQuest`.
          2. Download **`TriuneAutocombat-full.zip`** from the Assets below. It has everything: the Lua scripts, config, the offline game database (`resources/gamedb/`) and the MQ2Nav zone navmeshes (`resources/MQ2Nav/`).
          3. Extract the zip **into the root of your MacroQuest folder**. It merges `lua/`, `config/` and `resources/` into place.
          4. Windows users: add your MacroQuest folder as an antivirus exception before running it.
          5. Start `MacroQuest.exe`, then log into Project Triune. Triune opens by itself when you log in - if you close it, type `/ac` or `/lua run triune`.

          ### 🔄 Updating an existing installation
          1. Download **`TriuneAutocombat-Update.zip`** from the Assets below. It has everything except the MQ2Nav navmeshes (they rarely change) - grab the full zip if you also need those.
          2. Extract it **into the root of your MacroQuest folder** and overwrite files if asked.
          3. If Triune was running, type `/ac restart` (or relog) to load the new version.

          *Your own settings and saved loadouts (`config/triune_loadout_<server>_<char>.lua`, `config/triune_chat_<Name>.lua`) are never overwritten.*
          """.format(repo=os.environ.get('GITHUB_REPOSITORY', 'gennro/TriuneAutocombat'), tag=tag or 'main')
          footer = '\n'.join(line[10:] if line.startswith(' ' * 10) else line for line in footer.split('\n'))

          with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
              out.write(notes + footer.rstrip() + '\n')

          print('Generated RELEASE_NOTES.md for', tag or '(no tag)')
          print(open('RELEASE_NOTES.md', encoding='utf-8').read())
          EOF

      - name: Package Release Archives
        run: |
          # Both archives are built from the TAC/ tree so new modules, config
          # and resource files are picked up automatically. The update zip
          # ships everything except the MQ2Nav navmeshes (~1 GB, rarely
          # change); the full zip ships the whole tree.
          git archive --format=zip --add-file=README.md --add-file=CHANGELOG.md \
            -o TriuneAutocombat-Update.zip HEAD:TAC . ':!resources/MQ2Nav'
          git archive --format=zip --add-file=README.md --add-file=CHANGELOG.md \
            -o TriuneAutocombat-full.zip HEAD:TAC .

      - name: Verify Archive Contents
        run: |
          set -e
          for z in TriuneAutocombat-Update.zip TriuneAutocombat-full.zip; do
            echo "== $z ($(du -h "$z" | cut -f1))"
            unzip -l "$z" | grep -v '/MQ2Nav/'
            unzip -l "$z" | grep -q 'lua/triune.lua'   || { echo "missing lua/triune.lua in $z"; exit 1; }
            unzip -l "$z" | grep -q 'gamedb/manifest.txt' || { echo "missing resources/gamedb in $z"; exit 1; }
          done
          unzip -l TriuneAutocombat-Update.zip | grep -q '\.navmesh' && { echo "update zip must not contain navmeshes"; exit 1; }
          unzip -l TriuneAutocombat-full.zip   | grep -q '\.navmesh' || { echo "full zip is missing navmeshes"; exit 1; }
          echo "Archives verified"
      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TriuneAutocombat-Update.zip
            TriuneAutocombat-full.zip
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
