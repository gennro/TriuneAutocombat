name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lua-syntax:
    name: LuaJIT syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Bytecode-compile all Lua files
        run: |
          fail=0
          while IFS= read -r f; do
            if ! luajit -bl "$f" > /dev/null 2>err.log; then
              echo "::error file=$f::LuaJIT syntax error"
              cat err.log
              fail=1
            else
              echo "OK: $f"
            fi
          done < <(find mq2triune -name '*.lua' -type f)
          exit $fail

  version-sync:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract versions
        id: ver
        run: |
          MAIN=$(grep -oP "^local VERSION\s+= '\K[^']+" mq2triune/lua/triune.lua)
          UPDATER=$(grep -oP "^local VERSION = '\K[^']+" mq2triune/lua/triune_updater.lua)
          README=$(grep -oP "Current version: \*\*\K[^*]+" README.md)
          echo "main=$MAIN"    >> "$GITHUB_OUTPUT"
          echo "updater=$UPDATER" >> "$GITHUB_OUTPUT"
          echo "readme=$README"   >> "$GITHUB_OUTPUT"
          echo "triune.lua=$MAIN | triune_updater.lua=$UPDATER | README.md=$README"

      - name: Fail on version drift
        run: |
          if [ "${{ steps.ver.outputs.main }}" != "${{ steps.ver.outputs.updater }}" ] || \
             [ "${{ steps.ver.outputs.main }}" != "${{ steps.ver.outputs.readme }}" ]; then
            echo "::error::Version mismatch — triune.lua (${{ steps.ver.outputs.main }}), triune_updater.lua (${{ steps.ver.outputs.updater }}) and README.md (${{ steps.ver.outputs.readme }}) must all carry the same version."
            exit 1
          fi
          echo "All versions in sync: ${{ steps.ver.outputs.main }}"

  luacheck:
    name: Luacheck static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Luacheck
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Run Luacheck
        run: luacheck mq2triune/

  unit-tests:
    name: Pure-logic unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run unit tests
        run: luajit tests/test_pure_logic.lua

  theme-consistency:
    name: Theme consistency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check satellite theme drift
        run: bash tests/check_theme_consistency.sh
